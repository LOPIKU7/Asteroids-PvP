<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Asteroid PvP - Mobile</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
  
  canvas { display: none; background: #050508; position: absolute; }

  /* Trava visual para modo Retrato */
  @media screen and (orientation: portrait) {
    #portrait-warning { display: flex !important; }
  }
  #portrait-warning {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050508;
    z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #0ff;
  }

  /* Controles Mobile */
  #mobile-controls {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 40%;
    display: none; justify-content: space-between; align-items: flex-end;
    padding: 20px; pointer-events: none; z-index: 50;
  }
  .control-group { display: flex; gap: 20px; pointer-events: auto; }
  .joy-btn {
    width: 80px; height: 80px; background: rgba(255,255,255,0.1);
    border: 2px solid rgba(0,255,255,0.3); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #0ff; font-size: 30px; user-select: none;
  }
  .joy-btn:active { background: rgba(0,255,255,0.4); }

  /* UI de Menu e HUD */
  .overlay-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,7,10,0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 60; color: #fff; }
  #hud { position: absolute; top: 10px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; pointer-events: none; color: #fff; z-index: 40; }
  .hp-bar-bg { width: 150px; height: 10px; background: #222; border-radius: 5px; overflow: hidden; }
  .hp-bar-fill { height: 100%; background: #0ff; width: 100%; transition: 0.2s; }
  
  #game-over-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 80; color: #fff; }
</style>
</head>
<body>

<div id="portrait-warning">
  <h1>🔄</h1>
  <h2>Gire o celular para a horizontal</h2>
</div>

<div id="main-menu" class="overlay-ui">
  <h1 style="color:#0ff; text-shadow: 0 0 10px #0ff;">ASTEROID PvP</h1>
  <input type="text" id="p-name" placeholder="Nome" value="Piloto" style="padding:10px; border-radius:5px; border:none; margin-bottom:10px; text-align:center;">
  <button onclick="startGame()" style="padding:15px 40px; background:#0ff; border:none; border-radius:5px; font-weight:bold; cursor:pointer;">JOGAR AGORA</button>
</div>

<div id="game-over-screen">
  <h1 id="winner-text" style="font-size:50px;">VENCEDOR!</h1>
  <p>Reiniciando arena...</p>
</div>

<div id="hud">
  <div>
    <div id="hud-name" style="font-weight:bold;">PILOTO</div>
    <div class="hp-bar-bg"><div id="hp-fill" class="hp-bar-fill"></div></div>
    <div id="buff-list" style="font-size:10px; margin-top:5px;"></div>
  </div>
  <div style="text-align:right;">
    <div id="online-count">Online: 0</div>
  </div>
</div>

<div id="mobile-controls">
  <div class="control-group">
    <div class="joy-btn" id="m-left">◀</div>
    <div class="joy-btn" id="m-right">▶</div>
  </div>
  <div class="control-group">
    <div class="joy-btn" id="m-up" style="background:rgba(0,255,0,0.1);">🚀</div>
    <div class="joy-btn" id="m-shoot" style="background:rgba(255,0,0,0.1);">🔥</div>
  </div>
</div>

<canvas id="gameCanvas" width="1920" height="1080"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const keys = { up: false, left: false, right: false, shoot: false };
  let socket, myId, serverState = {players:{}, lasers:[], roids:[], items:[]};

  function resize() {
    const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    canvas.style.width = (1920 * scale) + 'px';
    canvas.style.height = (1080 * scale) + 'px';
    canvas.style.left = (window.innerWidth - (1920 * scale)) / 2 + 'px';
    canvas.style.top = (window.innerHeight - (1080 * scale)) / 2 + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  function startGame() {
    socket = io();
    const name = document.getElementById('p-name').value;
    
    socket.on('connect', () => {
      myId = socket.id;
      document.getElementById('main-menu').style.display = 'none';
      document.getElementById('hud').style.display = 'flex';
      if ('ontouchstart' in window) document.getElementById('mobile-controls').style.display = 'flex';
      canvas.style.display = 'block';
      socket.emit('joinGame', { name, color: '#0ff' });
      requestAnimationFrame(gameLoop);
    });

    socket.on('gameState', s => { serverState = s; updateHUD(); });
    socket.on('gameOver', d => {
      document.getElementById('winner-text').innerText = d.winnerName + " VENCEU!";
      document.getElementById('game-over-screen').style.display = 'flex';
    });
    socket.on('gameRestart', () => document.getElementById('game-over-screen').style.display = 'none');
  }

  // Lógica de Toque Mobile
  function setupBtn(id, key) {
    const el = document.getElementById(id);
    const start = (e) => { e.preventDefault(); keys[key] = true; socket.emit('playerInput', keys); };
    const end = (e) => { e.preventDefault(); keys[key] = false; socket.emit('playerInput', keys); };
    el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
  }
  setupBtn('m-left', 'left'); setupBtn('m-right', 'right');
  setupBtn('m-up', 'up'); setupBtn('m-shoot', 'shoot');

  // Lógica de Teclado (PC)
  window.addEventListener('keydown', e => {
    if(e.code==='KeyW'||e.code==='ArrowUp') keys.up=true;
    if(e.code==='KeyA'||e.code==='ArrowLeft') keys.left=true;
    if(e.code==='KeyD'||e.code==='ArrowRight') keys.right=true;
    if(e.code==='Space') keys.shoot=true;
    socket.emit('playerInput', keys);
  });
  window.addEventListener('keyup', e => {
    if(e.code==='KeyW'||e.code==='ArrowUp') keys.up=false;
    if(e.code==='KeyA'||e.code==='ArrowLeft') keys.left=false;
    if(e.code==='KeyD'||e.code==='ArrowRight') keys.right=false;
    if(e.code==='Space') keys.shoot=false;
    socket.emit('playerInput', keys);
  });

  function updateHUD() {
    const me = serverState.players[myId];
    if(me) {
      document.getElementById('hp-fill').style.width = me.hp + '%';
      document.getElementById('hud-name').innerText = me.name;
      let b = "";
      if(me.shieldTimer>0) b+="🛡️ ESCUDO "; if(me.tripleTimer>0) b+="🔥 TRIPLO "; if(me.speedTimer>0) b+="⚡ VELÔ ";
      document.getElementById('buff-list').innerText = b;
    }
    document.getElementById('online-count').innerText = "Online: " + Object.keys(serverState.players).length;
  }

  function gameLoop() {
    ctx.fillStyle = "#050508";
    ctx.fillRect(0,0,1920,1080);

    // Itens
    for(let it of serverState.items) {
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI*2);
      ctx.strokeStyle = "#fff"; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = "20px Arial"; ctx.textAlign="center";
      ctx.fillText(it.type[0], it.x, it.y+7);
    }

    // Asteroides
    ctx.strokeStyle = "#444"; ctx.lineWidth = 2;
    for(let r of serverState.roids) {
      ctx.beginPath();
      for(let i=0; i<r.vert; i++) {
        ctx.lineTo(r.x + r.r*r.offs[i]*Math.cos(r.a + i*Math.PI*2/r.vert), r.y + r.r*r.offs[i]*Math.sin(r.a + i*Math.PI*2/r.vert));
      }
      ctx.closePath(); ctx.stroke();
    }

    // Lasers
    for(let l of serverState.lasers) {
      ctx.fillStyle = "#0ff"; ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI*2); ctx.fill();
    }

    // Jogadores
    for(let id in serverState.players) {
      const p = serverState.players[id];
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(-p.a);
      ctx.strokeStyle = p.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(25, 0); ctx.lineTo(-15, 15); ctx.lineTo(-15, -15); ctx.closePath(); ctx.stroke();
      if(p.shieldTimer>0) { ctx.beginPath(); ctx.arc(0,0, 40, 0, Math.PI*2); ctx.strokeStyle="gold"; ctx.stroke(); }
      ctx.restore();
      ctx.fillStyle="#fff"; ctx.fillText(p.name, p.x, p.y-35);
    }
    requestAnimationFrame(gameLoop);
  }
</script>
</body>
</html>
